plugins {
    id 'com.android.application'
}

// Release signing comes from environment variables (set by the GitHub workflow from repo secrets).
// Without them the release APK is signed with the debug key so the build still works.
def ksFile = System.getenv("KEYSTORE_FILE")

android {
    namespace 'in.appbucket.spendsense'
    compileSdk 34

    defaultConfig {
        applicationId 'in.appbucket.spendsense'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '2.0.1'
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions 'sms'
    productFlavors {
        // Sideload-friendly build for appbucket.in: no SMS permissions, so Play Protect allows it.
        lite {
            dimension 'sms'
            buildConfigField 'boolean', 'SMS_AUTO', 'false'
            resValue 'string', 'app_name', 'SpendSense'
        }
        // Google Play build: reads transaction SMS automatically.
        full {
            dimension 'sms'
            applicationIdSuffix '.auto'   // can be installed alongside the lite build
            buildConfigField 'boolean', 'SMS_AUTO', 'true'
            resValue 'string', 'app_name', 'SpendSense Auto'
        }
    }

    signingConfigs {
        // Fixed debug key kept in the repo so every CI build has the same signature and
        // sideloaded updates install over the previous version. Not accepted by Google Play:
        // for Play, set the KEYSTORE_* secrets so release builds use your private key.
        debug {
            storeFile file('signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    testImplementation 'junit:junit:4.13.2'
}
