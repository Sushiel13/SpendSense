name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Optional: add repo secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # so every build is signed with the same key (needed for in-place app updates).
      - name: Decode signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets set - release APK will use the debug key."
          fi

      - name: Unit tests (SMS parser)
        run: gradle testLiteDebugUnitTest --no-daemon

      - name: Build release APKs and Play bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleLiteRelease assembleFullRelease bundleFullRelease --no-daemon
          cp app/build/outputs/apk/lite/release/app-lite-release.apk SpendSense.apk
          cp app/build/outputs/apk/full/release/app-full-release.apk SpendSense-full.apk
          cp app/build/outputs/bundle/fullRelease/app-full-release.aab SpendSense-full-play.aab

      - uses: actions/upload-artifact@v4
        with:
          name: SpendSense
          path: |
            SpendSense.apk
            SpendSense-full.apk
            SpendSense-full-play.aab

      - name: Read app version
        id: ver
        run: echo "version=$(grep -oP "versionName '\\K[^']+" app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: SpendSense ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            SpendSense.apk
            SpendSense-full.apk
            SpendSense-full-play.aab
